name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Detected: $JAVA_MAJOR"
            exit 1
          fi

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          KEYSTORE_PATH="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating debug keystore at $KEYSTORE_PATH..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Also place in android/ in case gradle looks locally
          cp "$KEYSTORE_PATH" android/debug.keystore 2>/dev/null || true
          echo "Temporary debug keystore verified at $KEYSTORE_PATH."

      - name: Build Debug APK
        run: |
          cd android
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          EXPECTED_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "Verified APK at $EXPECTED_APK"
          else
            echo "Searching for APKs inside android/app/build/outputs/apk..."
            find android/app/build/outputs/apk -name "*.apk" || true
            echo "Error: Expected debug APK not found or is empty at $EXPECTED_APK"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          REPO_NAME_CLEAN=$(echo "${{ github.event.repository.name }}" | tr -cd '[:alnum:]_-')
          if [ -z "$REPO_NAME_CLEAN" ]; then
            REPO_NAME_CLEAN="local-seller-pos"
          fi
          ASSET_NAME="${REPO_NAME_CLEAN}-debug-build-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/$ASSET_NAME"
          echo "Prepared asset at $TMP_DIR/$ASSET_NAME"
          echo "asset_path=$TMP_DIR/$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### 📱 Local Seller POS — Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions for testing and sideloading on Android devices.

          - **Build Run:** #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
          - **Commit SHA:** `${{ github.sha }}`
          - **Environment:** Android SDK 35 (Android 15), Kotlin 2.0, Jetpack Compose
          - **Signing:** Debug Keystore

          > **Note:** Sideloading this APK may trigger standard Android unknown-source prompts during installation.
          EOF

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --latest; then
            echo "::error::gh release create failed. This is usually caused by GitHub Workflow Permissions set to Read-only."
            exit 1
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url || echo "")
            echo "Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Name: ${{ steps.prepare_asset.outputs.asset_name }}"

            echo "### 🚀 Debug APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [Download APK Here]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Asset:** \`${{ steps.prepare_asset.outputs.asset_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Workflow Artifact:** \`app-debug-apk\` is also preserved in Actions." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or was skipped. However, your APK build succeeded!"
            echo "### ⚠️ Notice: APK Build Succeeded (Release Publishing Failed)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. **How to download your APK right now:**" >> $GITHUB_STEP_SUMMARY
            echo "   - Scroll to the bottom of this Actions run page to the **Artifacts** section." >> $GITHUB_STEP_SUMMARY
            echo "   - Click **\`app-debug-apk\`** to download your APK directly." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "2. **How to fix GitHub Releases for future runs (HTTP 403 fix):**" >> $GITHUB_STEP_SUMMARY
            echo "   - Go to your repository on GitHub: **Settings** > **Actions** > **General**" >> $GITHUB_STEP_SUMMARY
            echo "   - Scroll down to **Workflow permissions**" >> $GITHUB_STEP_SUMMARY
            echo "   - Change from *'Read repository contents'* to **'Read and write permissions'**" >> $GITHUB_STEP_SUMMARY
            echo "   - Click **Save**, then re-run the workflow." >> $GITHUB_STEP_SUMMARY
          fi
